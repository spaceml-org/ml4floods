[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml4floods"
dynamic = ["version"]
description = "Machine learning models for end-to-end flood extent segmentation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LGPL-3.0-or-later" }
authors = [{ name = "SpaceML-org" }]
keywords = ["floods", "pytorch", "machine-learning", "earth"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: GIS",
    "Development Status :: 5 - Production/Stable",
]
dependencies = [
    "torch",
    "torchvision",
    "pytorch-lightning",
    "numpy",
    "matplotlib",
    "pandas",
    "rasterio",
    "geopandas",
    "tqdm",
    "albumentations",
    "google-cloud-storage",
    "fsspec",
    "gcsfs",
    "beautifulsoup4",
    "requests",
    "earthengine-api",
    "mercantile",
    "seaborn",
    "gdown",
    "matplotlib-scalebar",
    "georeader-spaceml",
    "huggingface_hub[torch]",
]

[project.urls]
Homepage = "https://github.com/spaceml-org/ml4floods"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pre-commit", "pyprojroot"]
tests = ["pytest"]
docs = ["furo", "nbsphinx", "sphinx-copybutton", "jupyter-book", "ghp-import"]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]

[tool.setuptools.package-data]
ml4floods = [
    "models/configurations/*.json",
    "data/configuration/train_test_split_extra_dataset.json",
    "data/configuration/train_test_split_original_dataset.json",
]

[tool.setuptools.dynamic]
version = { attr = "ml4floods.__version__" }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "jupyterbook"]

[tool.ruff.lint]
# Conservative starter set on a legacy codebase. Tighten in follow-up PRs by
# enabling B and removing entries from `ignore` per module as it gets cleaned.
select = [
    "E", "F", "W",  # pycodestyle + pyflakes
    "I",            # isort
    "UP",           # pyupgrade
]
ignore = [
    "E402",  # module-import-not-at-top
    "E501",  # line too long (handled by formatter)
    "E711",  # comparison to None
    "E721",  # type comparison via ==
    "E722",  # bare except
    "E731",  # lambda assignment
    "E741",  # ambiguous variable name
    "F403",  # star imports
    "F405",  # may-be-undefined-from-star
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
